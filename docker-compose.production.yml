# Public HTTPS app deployment. MongoDB is provided by Atlas; the app and backup worker
# connect outbound, so no database port is exposed by this stack.
services:
  api:
    image: online-bookstore:${APP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: "5000"
      CLIENT_ORIGIN: "https://${DEMO_DOMAIN:?Set DEMO_DOMAIN in the root .env file}"
      PAYMENT_PROVIDER: "${PAYMENT_PROVIDER:-razorpay}"
      ALLOW_PAYMENT_SIMULATOR: "${ALLOW_PAYMENT_SIMULATOR:-false}"
    expose:
      - "5000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/health/ready', { headers: { 'X-Forwarded-Proto': 'https' } }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 45s
    networks:
      - web
      - operations
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN:?Set DEMO_DOMAIN in the root .env file}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  backup:
    image: online-bookstore-backup:${APP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: server/Dockerfile.backup
    environment:
      MONGODB_URI: ${BACKUP_MONGODB_URI:?Set a read-only BACKUP_MONGODB_URI in the root .env file}
      BACKUP_DIR: /backups
    volumes:
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    networks:
      - operations
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  web:
  operations:

volumes:
  caddy_data:
  caddy_config:
