services:
  - type: web
    name: online-bookstore-demo
    runtime: docker
    branch: main
    region: singapore
    plan: free
    numInstances: 1
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    # Seed the first administrator separately before the first deploy. A database
    # seed here can delay port binding beyond Render's startup window.
    dockerCommand: node src/server.js
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      # The hosted demo runs on the built-in payment simulator (no Razorpay account needed).
      # Razorpay test mode needs separate Render environment settings; the free demo uses no paid gateway.
      - key: PAYMENT_PROVIDER
        value: simulator
      - key: ALLOW_PAYMENT_SIMULATOR
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Render supplies its public HTTPS origin without a manual URL copy.
      - key: CLIENT_ORIGIN
        fromService:
          name: online-bookstore-demo
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
